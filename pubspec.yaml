name: study_assistant_app
description: A simple AI Study Assistant using Flutter and Google Gemini
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6

  # Google Gemini AI (Official)
  google_generative_ai: ^0.4.7

  # Environment variable (API Key)
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
